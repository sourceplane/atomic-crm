apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: web-tests
  description: The CRM's tests — upstream's component tests in a real browser, its edge-function tests, and the port's own (the Worker's routes, the functions' fetch, the build's project, the wrangler config) — run on every pull request

spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: tests
  change:
    inputs:
      - apps/web/**
      - tooling/wire/**
      - pnpm-lock.yaml
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
